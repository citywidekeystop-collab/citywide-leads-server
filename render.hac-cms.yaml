services:
  - type: web
    name: nln-hac-cms-staging
    runtime: node
    region: virginia
    plan: free
    buildCommand: cd hac-cms && npm install --omit=dev && npm run check && node --check admin.js && mkdir -p ../hac-preview/assets && curl --fail --location --retry 3 --max-time 120 'https://videos.pexels.com/video-files/4457655/4457655-hd_1920_1080_25fps.mp4' -o ../hac-preview/assets/neighborhood.mp4 && test -s ../hac-preview/assets/neighborhood.mp4
    startCommand: cd hac-cms && npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nln-hac-cms-db
          property: connectionString
      - key: SETUP_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
databases:
  - name: nln-hac-cms-db
    databaseName: hac_cms
    user: hac_cms
    region: virginia
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
